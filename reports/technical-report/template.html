<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Reporte técnico reproducible sobre PD, LGD, scorecard y aplicación web.">
<title>Riesgo de crédito | Reporte técnico</title><style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: #172b4d;
        background: #f3f6fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
      }

      .topbar {
        height: 6px;
        background: linear-gradient(90deg, #176b87, #45a88a);
      }

      main {
        width: min(100% - 40px, 880px);
        margin: 64px auto;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #16718a;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(2.35rem, 7vw, 4.5rem);
        letter-spacing: -0.055em;
        line-height: 1.04;
      }

      .subtitle {
        max-width: 720px;
        margin: 24px 0 0;
        color: #52647a;
        font-size: clamp(1.05rem, 2.5vw, 1.2rem);
        line-height: 1.75;
      }

      .rule {
        height: 1px;
        margin: 44px 0 36px;
        border: 0;
        background: #dce4ed;
      }

      h2 {
        margin: 48px 0 16px;
        font-size: 1.6rem;
        letter-spacing: -0.03em;
      }

      h3 {
        margin: 32px 0 12px;
        font-size: 1.16rem;
      }

      p,
      li {
        color: #384c63;
        line-height: 1.75;
      }

      a {
        color: #12677a;
      }

      .team {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: team;
      }

      .team li {
        display: grid;
        grid-template-columns: 42px 1fr;
        gap: 14px;
        align-items: start;
        padding: 16px 18px;
        border: 1px solid #e2e9f0;
        border-radius: 12px;
        background: #fff;
        counter-increment: team;
      }

      .team li::before {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 50%;
        background: #e7f3f4;
        color: #12677a;
        content: counter(team, decimal-leading-zero);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .name {
        display: block;
        margin: 1px 0 5px;
        color: #172b4d;
        font-weight: 700;
      }

      .role {
        color: #52647a;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .table-wrap {
        overflow-x: auto;
        margin: 18px 0 28px;
        border: 1px solid #e2e9f0;
        border-radius: 10px;
        background: #fff;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      caption {
        padding: 16px;
        color: #172b4d;
        font-weight: 700;
        text-align: left;
      }

      th,
      td {
        padding: 12px 16px;
        border-top: 1px solid #e8edf3;
        color: #384c63;
        line-height: 1.55;
        vertical-align: top;
      }

      th {
        background: #f8fafc;
        color: #172b4d;
      }

      figure {
        margin: 28px 0;
        padding: 22px;
        border: 1px solid #e2e9f0;
        border-radius: 12px;
        background: #fff;
      }

      figure img {
        display: block;
        width: 100%;
        height: auto;
      }

      figcaption {
        margin-top: 12px;
        color: #52647a;
        font-size: 0.88rem;
        line-height: 1.6;
      }

      .notice {
        margin: 26px 0;
        padding: 16px 18px;
        border-left: 3px solid #45a88a;
        border-radius: 0 8px 8px 0;
        background: #eaf5f1;
        color: #365c56;
        font-size: 0.94rem;
        line-height: 1.65;
      }

      .prompt-evidence {
        margin: 18px 0 28px;
        padding: 16px 22px;
        border-left: 3px solid #176b87;
        border-radius: 0 8px 8px 0;
        background: #eaf3f8;
      }

      .prompt-evidence p { margin: 0 0 12px; }
      .prompt-evidence p:last-child { margin-bottom: 0; }

      code {
        overflow-wrap: anywhere;
        color: #244b62;
      }

      pre {
        overflow-x: auto;
        padding: 16px;
        border-radius: 10px;
        background: #172b3d;
        color: #f1f5f8;
        line-height: 1.6;
      }

      pre code {
        color: inherit;
      }

      footer {
        margin-top: 56px;
        padding-top: 20px;
        border-top: 1px solid #dce4ed;
        color: #758398;
        font-size: 0.82rem;
      }

      @media (max-width: 560px) {
        main {
          width: min(100% - 32px, 880px);
          margin: 42px auto;
        }

        figure {
          padding: 14px;
        }

        th,
        td {
          padding: 10px 12px;
        }
      }

main { max-width:1080px; }
img { max-width:100%; height:auto; }
pre,.math-display { overflow-x:auto; padding:16px; }
.math-display { margin:16px 0; background:#f6f8fb; border-radius:8px; }
nav { padding:18px; background:#e7f3f4; border-radius:12px; margin:24px 0; }
nav ol { columns:2; padding-left:22px; }
h2 { scroll-margin-top:20px; }
li { overflow-wrap:anywhere; }
@media(max-width:600px) { nav ol { columns:1; } main { padding:20px; } }
@media print { nav { display:none; } .table-wrap { overflow:visible; } }
</style>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
</head><body><div aria-hidden="true" class="topbar"></div><main>
<p class="eyebrow">Reporte técnico · Proyecto académico</p>
<!-- REPORT_BODY -->
</main></body></html>
