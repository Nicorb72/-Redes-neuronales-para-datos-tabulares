seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed

evaluation:
  partition_strategy: temporal
  validation_size: 0.1
  test_size: 0.2
  shared_partitions: true
  neural_network_seeds: 30
  lgd_neural_network_seeds: 30

models:
  pd: configs/pd_mlp_best.yaml
  lgd: configs/lgd_mlp_best.yaml

scorecard:
  base_score: 600
  base_good_to_bad_odds: 50
  points_to_double_good_to_bad_odds: 20

app:
  pd_bundle: artifacts/models/pd_bundle.json
  report_url: "https://nicorb72.github.io/-Redes-neuronales-para-datos-tabulares/reports/technical-report/"
  video_url: "https://www.youtube.com/watch?v=TijgcPZNboU&feature=youtu.be"

demo:
  max_rows: 5000
  time_limit_seconds: 120
