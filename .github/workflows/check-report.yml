name: Verificar reporte técnico
on:
  pull_request:
    paths: ['reports/**', 'scripts/**', 'requirements-report.txt', 'artifacts/models/**', 'data/processed/**', '.github/workflows/check-report.yml']
  push:
    branches: [main, fix/reporte-tecnico]
    paths: ['reports/**', 'scripts/**', 'requirements-report.txt', 'artifacts/models/**', 'data/processed/**', '.github/workflows/check-report.yml']
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-report.txt
      - run: python scripts/build_report.py --check
