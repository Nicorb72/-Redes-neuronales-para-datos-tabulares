name: Pruebas de datos, scorecard y app
on:
  pull_request:
  push:
    branches: [main, INTEGRANTE-4, feature/integrante-4-scorecard-app]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest
      - run: python -m ruff check src/credit_risk/scorecard src/credit_risk/app tests/test_scorecard.py tests/test_app.py tests/test_interpretability.py tests/test_pd_app_integration.py run_app.py
